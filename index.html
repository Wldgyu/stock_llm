<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="실시간 주가와 ML·LLM 분석을 결합한 주식 대시보드">
  <title>Stock AI Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <nav class="navbar">
      <button class="navbar-brand" id="home-button" type="button">
        <span class="navbar-logo">📈</span>
        <span>
          <span class="navbar-title">Stock AI Dashboard</span>
          <span class="navbar-subtitle">실시간 시세 + LSTM + LLM 분석</span>
        </span>
      </button>
      <div class="navbar-status">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">서버 연결 확인 중...</span>
        <span class="server-time" id="server-time">--:--:--</span>
      </div>
    </nav>

    <main class="page main-page active" id="main-page">
      <header class="section-header">
        <h1 class="section-title">
          종목 현황
          <span class="section-badge">6개 관심 종목</span>
        </h1>
        <span class="timestamp-label" id="last-update"></span>
      </header>
      <div class="stocks-grid" id="stocks-grid" aria-live="polite"></div>
    </main>

    <main class="page detail-page" id="detail-page">
      <div class="detail-main">
        <div class="detail-actions">
          <button class="back-btn" id="back-button" type="button">← 목록으로</button>
          <button class="ai-btn" id="ai-button" type="button">
            <span class="ai-btn-icon">🤖</span>
            AI 분석 보기
            <span class="ai-btn-pulse"></span>
          </button>
        </div>

        <header class="detail-header">
          <div class="detail-title-group">
            <h2 class="detail-name" id="detail-name">—</h2>
            <span class="detail-symbol" id="detail-symbol">—</span>
            <span class="card-trend-badge detail-trend" id="detail-trend">—</span>
          </div>
          <div class="detail-price-group">
            <span class="price-label">실시간 현재가</span>
            <div class="detail-price" id="detail-price">—</div>
            <div class="detail-change" id="detail-change">—</div>
            <div class="detail-timestamp" id="detail-timestamp">시세 대기 중</div>
            <div class="analysis-close" id="analysis-close"></div>
          </div>
        </header>

        <section id="analysis-section" aria-labelledby="analysis-kpi-title">
          <div class="subsection-header">
            <h3 id="analysis-kpi-title">배치 분석 지표</h3>
            <span id="analysis-message"></span>
          </div>
          <div class="kpi-row" id="analysis-kpis"></div>
        </section>

        <section class="chart-section" aria-labelledby="live-chart-title">
          <div class="chart-section-header">
            <div>
              <h3 class="chart-title" id="live-chart-title">실시간 가격 차트</h3>
              <div class="interval-bar" id="interval-bar">
                <button class="interval-btn" type="button" data-interval="1m">1분</button>
                <button class="interval-btn" type="button" data-interval="5m">5분</button>
                <button class="interval-btn" type="button" data-interval="15m">15분</button>
                <button class="interval-btn" type="button" data-interval="1h">1시간</button>
                <button class="interval-btn active" type="button" data-interval="1d">1일</button>
                <button class="interval-btn" type="button" data-interval="1wk">1주</button>
              </div>
            </div>
            <span class="live-badge"><span class="live-dot"></span> LIVE</span>
          </div>

          <div class="live-kpi-strip" id="live-kpis"></div>

          <div class="live-chart-grid">
            <div class="live-price-panel">
              <span class="panel-label">PRICE · MA · BOLLINGER</span>
              <div class="chart-loading" id="chart-loading"><span class="spinner"></span></div>
              <canvas id="live-price-chart"></canvas>
            </div>
            <div class="live-rsi-panel">
              <span class="panel-label">RSI (14)</span>
              <canvas id="live-rsi-chart"></canvas>
            </div>
          </div>
        </section>

        <section class="prediction-section" id="prediction-section" aria-labelledby="prediction-title">
          <h3 class="prediction-title" id="prediction-title">LSTM 가격 예측 범위</h3>
          <div class="prediction-cards" id="prediction-cards"></div>
        </section>
      </div>
    </main>

    <aside class="ai-panel" id="ai-panel" aria-hidden="true">
      <div class="ai-panel-inner">
        <div class="ai-panel-header">
          <div class="ai-panel-title">🤖 AI 페르소나 분석 — <span id="ai-stock-name"></span></div>
          <button class="ai-panel-close" id="ai-close-button" type="button" aria-label="닫기">✕</button>
        </div>
        <div id="ai-panel-content"></div>
      </div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
